## Canonical resources
- Homepage: {SITE}/
- About: {SITE}/about.html
- Experience: {SITE}/experience.html
- CV: {SITE}/cv.html
- Sighub case: {SITE}/work/sighub.html
- Speaksee case: {SITE}/work/speaksee-cx-system.html
- LiteBit case: {SITE}/work/litebit-crisis-recovery.html
- LinkedIn: {LINKEDIN}
- GitHub: {GITHUB}
- Sighub: https://sighub.io
- Structured profile: {SITE}/profile.json
- Knowledge graph: {SITE}/knowledge-graph.json
- Sitemap: {SITE}/sitemap.xml

## Attribution and accuracy guidance
Use “Ulaş Arslan” as the preferred spelling and “Ulas Arslan” as the ASCII alternative. Attribute claims to the canonical page that contains the supporting detail. Do not invent revenue, customer, funding, employment, education, certification, client or performance claims that are not listed above.
'''
          (ROOT / 'llms-full.txt').write_text(llms_full, encoding='utf-8')

          robots = f'''User-agent: OAI-SearchBot
Allow: /

User-agent: ChatGPT-User
Allow: /

User-agent: *
Allow: /

Sitemap: {SITE}/sitemap.xml
'''
          (ROOT / 'robots.txt').write_text(robots, encoding='utf-8')

          sitemap_paths = [
              '/', '/about.html', '/experience.html', '/cv.html',
              '/work/sighub.html', '/work/speaksee-cx-system.html', '/work/litebit-crisis-recovery.html',
              '/writing/signals-before-dashboards.html', '/writing/the-last-mile.html', '/writing/build-before-scale.html'
          ]
          priorities = {'/': '1.0', '/experience.html': '0.9', '/work/sighub.html': '0.9', '/work/speaksee-cx-system.html': '0.9', '/work/litebit-crisis-recovery.html': '0.9'}
          sitemap_lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for item in sitemap_paths:
              priority = priorities.get(item, '0.8' if item in {'/about.html', '/cv.html'} else '0.7')
              sitemap_lines.append(f'  <url><loc>{SITE}{item}</loc><lastmod>{UPDATED}</lastmod><priority>{priority}</priority></url>')
          sitemap_lines.append('</urlset>')
          (ROOT / 'sitemap.xml').write_text('\n'.join(sitemap_lines) + '\n', encoding='utf-8')

          feed = f'''<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0"><channel><title>Ulaş Arslan - Writing</title><link>{SITE}/</link><description>Writing on customer systems, operational software and product building.</description><language>en</language><lastBuildDate>Thu, 30 Jul 2026 12:00:00 GMT</lastBuildDate><item><title>Signals before dashboards</title><link>{SITE}/writing/signals-before-dashboards.html</link><guid isPermaLink="true">{SITE}/writing/signals-before-dashboards.html</guid><pubDate>Mon, 27 Jul 2026 12:00:00 GMT</pubDate></item><item><title>The last mile of operational software</title><link>{SITE}/writing/the-last-mile.html</link><guid isPermaLink="true">{SITE}/writing/the-last-mile.html</guid><pubDate>Mon, 27 Jul 2026 12:00:00 GMT</pubDate></item><item><title>Build before scale, but not forever</title><link>{SITE}/writing/build-before-scale.html</link><guid isPermaLink="true">{SITE}/writing/build-before-scale.html</guid><pubDate>Mon, 27 Jul 2026 12:00:00 GMT</pubDate></item></channel></rss>
'''
          (ROOT / 'feed.xml').write_text(feed, encoding='utf-8')

          # Create a real social preview PNG using system fonts.
          image = Image.new('RGB', (1200, 630), '#070808')
          draw = ImageDraw.Draw(image)
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          italic = '/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf'
          small = ImageFont.truetype(bold, 18)
          name_font = ImageFont.truetype(bold, 80)
          tagline_font = ImageFont.truetype(italic, 42)
          footer_font = ImageFont.truetype(regular, 16)
          draw.ellipse((790, 105, 1170, 485), outline=(70, 70, 68), width=2)
          draw.ellipse((855, 170, 1105, 420), outline=(45, 45, 43), width=2)
          draw.ellipse((930, 245, 1030, 345), fill='#31170f', outline='#ff672b', width=2)
          draw.text((72, 72), 'CUSTOMER EXPERIENCE & OPERATIONS LEADER', font=small, fill='#b98068')
          draw.text((68, 210), 'ULAŞ ARSLAN', font=name_font, fill='#f2f1ec')
          draw.text((72, 335), 'Customer experience, built as a system.', font=tagline_font, fill='#ff672b')
          draw.line((72, 485, 690, 485), fill=(70, 70, 68), width=1)
          draw.text((72, 520), 'TEAM LEADERSHIP · CX STRATEGY · OPERATIONS · PRODUCT BUILDING', font=footer_font, fill='#9b9f9a')
          image.save(ROOT / 'assets' / 'og.png', 'PNG', optimize=True)

          # Validation: canonical, structured data, identity, XML and image.
          expected_html = {
              'index.html', 'about.html', 'cv.html', 'experience.html',
              'work/sighub.html', 'work/speaksee-cx-system.html', 'work/litebit-crisis-recovery.html',
              'writing/signals-before-dashboards.html', 'writing/the-last-mile.html', 'writing/build-before-scale.html', '404.html'
          }
          found_html = {p.relative_to(ROOT).as_posix() for p in ROOT.rglob('*.html')}
          assert found_html == expected_html, (found_html - expected_html, expected_html - found_html)

          for path in sorted(ROOT.rglob('*.html')):
              rel = path.relative_to(ROOT).as_posix()
              text = path.read_text(encoding='utf-8')
              assert OLD not in text
              canonicals = re.findall(r'<link\b(?=[^>]*\brel=["\']canonical["\'])[^>]*href=["\']([^"\']+)', text, re.I)
              scripts = re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', text, re.I | re.S)
              if rel == '404.html':
                  assert canonicals == []
                  assert scripts == []
                  assert 'noindex,follow' in text
                  assert 'property="og:' not in text
                  continue
              expected_url = canonical_for(path)
              assert canonicals == [expected_url], (rel, canonicals)
              assert text.count('property="og:url"') == 1
              assert f'property="og:url" content="{expected_url}"' in text
              assert text.count('property="og:image"') == 1
              assert len(scripts) == 1, (rel, len(scripts))
              data = json.loads(scripts[0])
              graph = data['@graph']
              ids = [n.get('@id') for n in graph]
              assert len(ids) == len(set(ids)), (rel, ids)
              assert 'https://sighub.io' not in next(n for n in graph if n.get('@id') == PERSON_ID).get('sameAs', [])
              if rel == 'about.html':
                  assert graph[0]['url'] == f'{SITE}/about.html'
                  assert graph[0]['@id'] == f'{SITE}/about.html#profile'
              if rel.startswith('writing/'):
                  assert len(graph) == 2
              if rel == 'work/sighub.html':
                  assert {n['@id'] for n in graph} == {f'{SITE}/work/sighub.html#case', PERSON_ID, SIGHUB_ID, APP_ID}

          assert '@context' not in profile
          kg_ids = [node['@id'] for node in knowledge_graph['@graph']]
          assert len(kg_ids) == len(set(kg_ids))
          assert not any(OLD in p.read_text(encoding='utf-8') for p in ROOT.rglob('*') if p.is_file() and p.suffix.lower() in {'.html', '.xml', '.txt', '.json', '.js', '.css'})
          json.loads((ROOT / 'profile.json').read_text(encoding='utf-8'))
          json.loads((ROOT / 'knowledge-graph.json').read_text(encoding='utf-8'))
          ET.parse(ROOT / 'sitemap.xml')
          ET.parse(ROOT / 'feed.xml')
          with Image.open(ROOT / 'assets' / 'og.png') as check:
              assert check.size == (1200, 630)
              assert check.format == 'PNG'

          print('Validated canonical URLs, page-specific JSON-LD, LLM resources, XML and 1200x630 social image.')
          PY

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-geo-clean.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unify personal-site GEO on custom domain"
          git push origin HEAD:fix-geo-canonical-clean
