name: One-time page schema cleanup

on:
  push:
    branches:
      - fix-geo-canonical-consistency

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-geo-canonical-consistency
          fetch-depth: 0

      - name: Build precise page-level structured data
        run: |
          python <<'PY'
          from pathlib import Path
          import html
          import json
          import re

          ROOT = Path('personal-site')
          SITE = 'https://www.ulasarslan.com'
          PERSON_ID = f'{SITE}/#person'
          WEBSITE_ID = f'{SITE}/#website'
          SPEAKSEE_ID = 'https://speak-see.com/#organization'
          SIGHUB_ID = 'https://sighub.io/#organization'
          APP_ID = 'https://sighub.io/#renewal-radar'
          TODAY = '2026-07-30'
          OG_IMAGE = f'{SITE}/assets/og.png'

          PERSON = {
              '@type': 'Person', '@id': PERSON_ID, 'name': 'Ulaş Arslan',
              'alternateName': 'Ulas Arslan', 'url': f'{SITE}/',
              'image': f'{SITE}/assets/portrait.svg',
              'jobTitle': 'Customer Experience Manager and Product Builder',
              'description': 'Customer Experience and Operations leader, team lead and product builder based in Rotterdam.',
              'homeLocation': {'@type': 'Place', 'name': 'Rotterdam, Netherlands'},
              'worksFor': {'@id': SPEAKSEE_ID}, 'owns': {'@id': SIGHUB_ID},
              'sameAs': ['https://nl.linkedin.com/in/ulasarslan', 'https://github.com/ulasarslan6262-ui'],
              'knowsAbout': ['Customer Experience Strategy', 'Customer Operations', 'Team Leadership', 'Support Optimization', 'Process Design and Automation', 'Customer Signal Analysis', 'Cross-Functional Alignment', 'B2B SaaS Product Development']
          }
          WEBSITE = {'@type': 'WebSite', '@id': WEBSITE_ID, 'url': f'{SITE}/', 'name': 'Ulaş Arslan', 'publisher': {'@id': PERSON_ID}, 'inLanguage': 'en'}
          SPEAKSEE = {'@type': 'Organization', '@id': SPEAKSEE_ID, 'name': 'Speaksee', 'url': 'https://speak-see.com'}
          SIGHUB = {'@type': 'Organization', '@id': SIGHUB_ID, 'name': 'Sighub', 'url': 'https://sighub.io', 'founder': {'@id': PERSON_ID}}
          APP = {'@type': 'SoftwareApplication', '@id': APP_ID, 'name': 'Renewal Radar by Sighub', 'url': 'https://sighub.io', 'applicationCategory': 'BusinessApplication', 'operatingSystem': 'Web', 'description': 'A HubSpot app that turns structured CRM renewal risk signals into one clear owner task using deterministic, auditable logic.', 'creator': {'@id': PERSON_ID}, 'subjectOf': {'@id': f'{SITE}/work/sighub.html#case'}}

          def extract_title(text):
              match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
              return html.unescape(match.group(1).strip()) if match else 'Ulaş Arslan'

          def extract_description(text):
              match = re.search(r'<meta\s+name=(["\'])description\1\s+content=(["\'])(.*?)\2', text, re.I | re.S)
              return html.unescape(match.group(3).strip()) if match else 'Ulaş Arslan is a Customer Experience and Operations leader and product builder based in Rotterdam.'

          def url_for(path):
              rel = path.relative_to(ROOT).as_posix()
              return f'{SITE}/' if rel == 'index.html' else f'{SITE}/{rel}'

          def page_node(node_type, node_id, url, name, description, **extra):
              node = {'@type': node_type, '@id': node_id, 'url': url, 'name': name, 'description': description, 'isPartOf': {'@id': WEBSITE_ID}, 'inLanguage': 'en', **extra}
              return node

          def article_node(url, title, description, suffix, about=None):
              node = {
                  '@type': 'Article', '@id': f'{url}#{suffix}', 'url': url,
                  'headline': title, 'description': description,
                  'mainEntityOfPage': url, 'isPartOf': {'@id': WEBSITE_ID},
                  'author': {'@id': PERSON_ID}, 'image': OG_IMAGE,
                  'dateModified': TODAY, 'inLanguage': 'en'
              }
              if about:
                  node['about'] = {'@id': about}
              return node

          def graph_for(path, title, description):
              rel = path.relative_to(ROOT).as_posix()
              url = url_for(path)
              if rel == 'index.html':
                  profile = page_node('ProfilePage', f'{SITE}/#profile', url, title, description, mainEntity={'@id': PERSON_ID}, dateModified=TODAY)
                  return [WEBSITE, profile, PERSON, SPEAKSEE, SIGHUB, APP]
              if rel == 'about.html':
                  profile = page_node('ProfilePage', f'{url}#profile', url, title, description, mainEntity={'@id': PERSON_ID}, dateModified=TODAY)
                  return [profile, PERSON, SPEAKSEE, SIGHUB]
              if rel == 'cv.html':
                  profile = page_node('ProfilePage', f'{url}#profile', url, title, description, mainEntity={'@id': PERSON_ID}, dateModified=TODAY)
                  return [profile, PERSON]
              if rel == 'experience.html':
                  page = page_node('WebPage', f'{url}#webpage', url, title, description, about={'@id': PERSON_ID}, mainEntity={'@id': PERSON_ID}, dateModified=TODAY)
                  return [page, PERSON]
              if rel == 'work/sighub.html':
                  return [article_node(url, title, description, 'case', APP_ID), PERSON, SIGHUB, APP]
              if rel == 'work/speaksee-cx-system.html':
                  return [article_node(url, title, description, 'case', SPEAKSEE_ID), PERSON, SPEAKSEE]
              if rel == 'work/litebit-crisis-recovery.html':
                  return [article_node(url, title, description, 'case'), PERSON]
              if rel.startswith('writing/'):
                  return [article_node(url, title, description, 'article'), PERSON]
              page = page_node('WebPage', f'{url}#webpage', url, title, description, about={'@id': PERSON_ID}, dateModified=TODAY)
              return [page, PERSON]

          script_pattern = re.compile(r'<script\s+type=["\']application/ld\+json["\'][^>]*>.*?</script>', re.I | re.S)

          for path in sorted(ROOT.rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              rel = path.relative_to(ROOT).as_posix()

              if rel == '404.html':
                  body = re.search(r'<body>(.*)</body>', text, re.I | re.S).group(1)
                  clean = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found - Ulaş Arslan</title><meta name="description" content="The requested page could not be found on Ulaş Arslan’s website."><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="/subpage.css"><link rel="icon" href="/assets/favicon.svg"></head><body>' + body + '</body></html>'
                  path.write_text(clean, encoding='utf-8')
                  continue

              title = extract_title(text)
              description = extract_description(text)
              graph = {'@context': 'https://schema.org', '@graph': graph_for(path, title, description)}
              script = '<script type="application/ld+json">' + json.dumps(graph, ensure_ascii=False, separators=(',', ':')) + '</script>'
              if script_pattern.search(text):
                  text = script_pattern.sub(script, text, count=1)
                  text = script_pattern.sub('', text)
              else:
                  text = text.replace('</head>', script + '</head>', 1)

              if 'property="og:image:type"' not in text:
                  text = text.replace('</head>', '<meta property="og:image:type" content="image/png"></head>', 1)
              if rel.startswith('work/') or rel.startswith('writing/'):
                  text = re.sub(r'<meta\s+property=["\']article:modified_time["\'][^>]*>', '', text, flags=re.I)
                  text = text.replace('</head>', f'<meta property="article:modified_time" content="{TODAY}"></head>', 1)
              path.write_text(text, encoding='utf-8')

          # Validate exact page semantics.
          for path in sorted(ROOT.rglob('*.html')):
              rel = path.relative_to(ROOT).as_posix()
              text = path.read_text(encoding='utf-8')
              if rel == '404.html':
                  assert 'noindex,follow' in text
                  assert 'rel="canonical"' not in text
                  assert 'application/ld+json' not in text
                  assert 'og:url' not in text
                  continue
              scripts = re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', text, re.I | re.S)
              assert len(scripts) == 1, (rel, len(scripts))
              data = json.loads(scripts[0])
              graph = data['@graph']
              ids = [node.get('@id') for node in graph]
              assert len(ids) == len(set(ids)), (rel, ids)
              assert 'ulas-arslan.vercel.app' not in json.dumps(data)
              if rel == 'about.html':
                  assert graph[0]['url'] == f'{SITE}/about.html'
                  assert graph[0]['@id'] == f'{SITE}/about.html#profile'
              if rel == 'cv.html':
                  assert graph[0]['@type'] == 'ProfilePage'
                  assert graph[0]['url'] == f'{SITE}/cv.html'
              if rel.startswith('writing/'):
                  assert len(graph) == 2
                  assert graph[0]['@type'] == 'Article'
                  assert not any(node.get('@id') in {SPEAKSEE_ID, SIGHUB_ID, APP_ID} for node in graph)
              if rel == 'experience.html':
                  assert len(graph) == 2
                  assert graph[0]['url'] == f'{SITE}/experience.html'
              if rel == 'work/speaksee-cx-system.html':
                  assert {node['@id'] for node in graph} == {f'{SITE}/work/speaksee-cx-system.html#case', PERSON_ID, SPEAKSEE_ID}
              if rel == 'work/sighub.html':
                  assert {node['@id'] for node in graph} == {f'{SITE}/work/sighub.html#case', PERSON_ID, SIGHUB_ID, APP_ID}
              if rel == 'work/litebit-crisis-recovery.html':
                  assert len(graph) == 2
              assert 'property="og:image:type" content="image/png"' in text

          print('Page-specific JSON-LD and 404 metadata validated.')
          PY

      - name: Commit page-specific schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-page-schema-cleanup.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use precise page-specific structured data"
          git push origin HEAD:fix-geo-canonical-consistency
