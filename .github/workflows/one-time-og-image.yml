name: One-time Open Graph image

on:
  push:
    branches:
      - fix-geo-canonical-consistency

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-geo-canonical-consistency
          fetch-depth: 0

      - name: Generate validated social preview PNG
        run: |
          python -m pip install --quiet cairosvg pillow
          python <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          source = Path('personal-site/assets/og.svg')
          target = Path('personal-site/assets/og.png')
          cairosvg.svg2png(url=str(source), write_to=str(target), output_width=1200, output_height=630)
          with Image.open(target) as image:
              if image.size != (1200, 630):
                  raise RuntimeError(f'Unexpected OG image size: {image.size}')
              if image.format != 'PNG':
                  raise RuntimeError(f'Unexpected OG image format: {image.format}')
          if target.stat().st_size < 20000:
              raise RuntimeError(f'OG image unexpectedly small: {target.stat().st_size} bytes')
          print(f'Generated {target} ({target.stat().st_size} bytes, 1200x630 PNG)')
          PY

      - name: Commit social preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-og-image.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add production Open Graph PNG"
          git push origin HEAD:fix-geo-canonical-consistency
